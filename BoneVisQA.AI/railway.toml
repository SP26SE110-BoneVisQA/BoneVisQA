[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Do not preload ML weights at startup — loading mpnet + BiomedCLIP in the background OOM-kills
# small Railway instances and causes a crash/restart loop. Models load lazily on first request.
[env]
SKIP_EMBEDDING_WARMUP = "true"
WARMUP_MODELS = "none"
